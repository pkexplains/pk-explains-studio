<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:Lexend}
#t{position:relative;width:1280px;height:720px;background:#0B1226;overflow:hidden}
.shot{position:absolute;right:-40px;top:0;width:900px;height:720px;background:url(f38.png) no-repeat;background-size:1560px auto;background-position:-215px -60px;filter:saturate(1.05) brightness(1.1)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#0B1226 0%,#0B1226 34%,rgba(11,18,38,.85) 46%,rgba(11,18,38,0) 66%)}
.dark{position:absolute;inset:0;background:radial-gradient(ellipse 50% 60% at 72% 48%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
.txt{position:absolute;left:64px;top:120px;width:620px;color:#F7F7F5}
.k{font-weight:800;font-size:58px;letter-spacing:.06em;color:#EAAA45;text-transform:uppercase}
.h{font-weight:800;font-size:112px;line-height:1.0;margin-top:18px;letter-spacing:-.01em}
.h span{color:#EAAA45}
.s{margin-top:28px;font-size:34px;color:#CBD1E2;font-weight:400}
.tile{position:absolute;left:64px;bottom:52px;width:64px;height:64px;border-radius:21%;background:#EAAA45;color:#121E3B;font-weight:700;font-size:31px;display:grid;place-items:center}
</style></head><body><div id="t"><div class="shot"></div><div class="dark"></div><div style="position:absolute;inset:0;background:linear-gradient(180deg,#0B1226 0,#0B1226 4%,rgba(11,18,38,0) 16%)"></div><div class="fade"></div>
<div class="txt"><div class="k">Power cut</div><div class="h">Is her <span>₹200</span> safe?</div><div class="s">How databases keep a promise</div></div>
<div class="tile">PK</div></div></body></html>
