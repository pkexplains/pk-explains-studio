      <svg id="world" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="worldTitle">
        <title id="worldTitle">A kitchen where PostgreSQL staff and the operating system Manager act out one database update</title>
        <defs>
          <linearGradient id="beamg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C14E" stop-opacity=".55"/><stop offset="1" stop-color="#F2C14E" stop-opacity=".06"/></linearGradient>
          <mask id="spotm" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" fill="#fff"/><circle id="spotc" cx="960" cy="540" r="200" fill="#000"/></mask>
        </defs>
        <rect x="0" y="0" width="1920" height="1080" class="void"/>
        <g id="cam">
          <rect x="-1200" y="-800" width="4800" height="1700" class="wall"/>
          <circle cx="830" cy="560" r="330" class="art-pg"/>
          <circle cx="1365" cy="250" r="230" class="art-ring"/>
          <rect x="1730" y="250" width="150" height="16" class="art-disk"/>
          <rect x="-1200" y="900" width="4800" height="900" class="floor"/>
          <line x1="-1200" y1="900" x2="3600" y2="900" class="floorline"/>
          <line x1="70" y1="186" x2="1700" y2="186" class="rail"/>
          <rect x="40" y="600" width="120" height="300" rx="8" class="door"/>
          <circle cx="140" cy="760" r="6" class="knob"/>
          <text x="100" y="584" class="lbl" text-anchor="middle">ENTRANCE</text>
          <rect x="268" y="830" width="56" height="70" rx="6" class="podium"/>
          <rect x="360" y="820" width="140" height="80" rx="6" class="desk"/>
          <text x="430" y="868" class="lbl small" text-anchor="middle">KERNEL</text>
          <rect x="600" y="300" width="420" height="140" rx="12" class="board"/>
          <text x="622" y="340" class="lbl">ORDER LEDGER · pg_xact</text>
          <text x="622" y="410" id="ledgerRow" class="ledger">#812 · —</text>
          <rect x="1220" y="270" width="290" height="630" rx="24" class="fridge"/>
          <text x="1365" y="305" class="lbl" text-anchor="middle">FRIDGE · RAM</text>
          <line x1="1236" y1="430" x2="1494" y2="430" class="shelf-pg"/>
          <text x="1365" y="458" class="lbl small" text-anchor="middle">COMPANY SHELF · shared buffers</text>
          <line x1="1236" y1="640" x2="1494" y2="640" class="shelf-os"/>
          <text x="1365" y="668" class="lbl small" text-anchor="middle">MANAGER'S SHELF · page cache</text>
          <rect x="1240" y="770" width="70" height="60" class="cubby"/>
          <rect x="1330" y="770" width="70" height="60" class="cubby"/>
          <rect x="1420" y="770" width="70" height="60" class="cubby"/>
          <text x="1365" y="858" class="lbl small" text-anchor="middle">private spots</text>
          <rect x="1700" y="360" width="215" height="540" rx="10" class="store"/>
          <text x="1808" y="396" class="lbl" text-anchor="middle">STOREROOM · disk</text>
          <line x1="1712" y1="600" x2="1903" y2="600" class="shelf-disk"/>
          <text x="1808" y="626" class="lbl small" text-anchor="middle">data files</text>
          <line x1="1712" y1="830" x2="1903" y2="830" class="shelf-disk"/>
          <text x="1808" y="856" class="lbl small" text-anchor="middle">WAL files</text>
          <g id="storeErr" style="display:none"><circle cx="1808" cy="470" r="44" class="err"/><path d="M1786 448 L1830 492 M1830 448 L1786 492" class="errx"/></g>
          <rect x="1585" y="716" width="40" height="184" class="stand"/>
          <g id="notebook" transform="translate(1600 646)">
            <rect x="-106" y="-74" width="212" height="140" rx="8" class="nbcover"/>
            <rect x="-98" y="-66" width="96" height="124" class="nbpage"/>
            <rect x="2" y="-66" width="96" height="124" class="nbpage"/>
            <text x="0" y="-86" class="lbl small" text-anchor="middle">NOTEBOOK · WAL</text>
            <g id="nblines"></g>
          </g>
          <line x1="1930" y1="960" x2="2270" y2="960" class="road"/>
          <rect x="2280" y="420" width="360" height="480" rx="10" class="store"/>
          <text x="2460" y="456" class="lbl" text-anchor="middle">ACROSS TOWN · replica</text>
          <rect x="2360" y="500" width="200" height="400" rx="16" class="fridge"/>
          <line x1="2372" y1="660" x2="2548" y2="660" class="shelf-pg"/>
          <g id="beams"></g>
          <g id="fixtures"></g>
          <g id="props"></g>
          <g id="chars"></g>
          <g id="front"><rect x="530" y="826" width="530" height="74" rx="6" class="counter"/><text x="795" y="872" class="lbl small" text-anchor="middle">COUNTER · other customers' orders</text></g>
          <g id="fx"></g>
          <g id="tags"></g>
        </g>
        <rect id="spotdim" x="0" y="0" width="1920" height="1080" mask="url(#spotm)" style="opacity:0;pointer-events:none"/>
        <rect id="dark" x="0" y="0" width="1920" height="1080" style="opacity:0;pointer-events:none"/>
      </svg>
